<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SHIZAZ AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#070b14;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:32px;
    letter-spacing:2px;
}

.logo span{
    color:#4f8cff;
}

.logo p{
    color:#8b95a7;
    margin-top:8px;
}

.login-box{
    background:#101725;
    border:1px solid #202b3d;
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.login-box h2{
    font-size:26px;
    margin-bottom:8px;
}

.subtitle{
    color:#8b95a7;
    margin-bottom:28px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#cbd5e1;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #2a374d;
    background:#0a101c;
    color:white;
    outline:none;
    font-size:15px;
}

.input-group input:focus{
    border-color:#4f8cff;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:13px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#9ca8ba;
}

.forgot{
    color:#4f8cff;
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4f8cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#3978e8;
    transform:translateY(-1px);
}

.demo{
    text-align:center;
    margin-top:22px;
    padding:12px;
    background:#0b1220;
    border-radius:10px;
    color:#8b95a7;
    font-size:13px;
}

.back{
    text-align:center;
    margin-top:22px;
}

.back a{
    color:#8b95a7;
    text-decoration:none;
    font-size:14px;
}

.back a:hover{
    color:white;
}

@media(max-width:500px){
    .login-box{
        padding:25px 20px;
    }

    .logo h1{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>SHIZAZ <span>AI</span></h1>
        <p>Enterprise Intelligence Platform</p>
    </div>

    <div class="login-box">

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your SHIZAZ AI dashboard.</p>

        <form onsubmit="login(event)">

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@company.com"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <span class="forgot" onclick="forgotPassword()">
                    Forgot password?
                </span>

            </div>

            <button class="login-btn" type="submit">
                Sign In
            </button>

        </form>

        <div class="demo">
            Demo Login — Enter any email and password
        </div>

    </div>

    <div class="back">
        <a href="index.html">← Back to SHIZAZ AI</a>
    </div>

</div>

<script>

function login(event){

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email && password){

        localStorage.setItem("shizaz_logged_in","true");
        localStorage.setItem("shizaz_user_email",email);

        alert("Login successful! Welcome to SHIZAZ AI.");

        window.location.href="dashboard.html";

    }

}

function forgotPassword(){

    alert("Password recovery will be available in the full SHIZAZ AI version.");

}

</script>

</body>
</html>
